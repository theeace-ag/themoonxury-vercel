services:
  - type: web
    name: moonxury
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
